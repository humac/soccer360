# Soccer360 Pipeline Configuration

paths:
  ingest: /tank/ingest
  scratch: /scratch/work
  processed: /tank/processed
  highlights: /tank/highlights
  models: /tank/models
  labeling: /tank/labeling
  stagging: /tank/stagging
  archive_raw: /tank/archive_raw
  logs: /tank/logs

model:
  path: /app/models/ball_best.pt
  base_model: /app/models/yolo26l.pt
  tensorrt_path: /app/models/ball_best.engine
  # Inference backend: fp32 (default baseline) or tensorrt_int8 (optimization)
  backend: fp32

detector:
  runtime_override_path: /tank/data/ingest_model_selection.json
  player_runtime_override_path: /tank/data/ingest_player_model_selection.json
  ball_model_config_override_path: /tank/data/ball_model_config.json
  player_model_path: /app/models/yolo26l.pt
  batch_size: 16
  batch_size_tensorrt: 32
  resolution: [1920, 960]
  confidence_threshold: 0.25
  nms_iou_threshold: 0.45
  # Process every Nth frame (1 = all frames, 2 = skip every other, etc.)
  # Skipped frames get positions interpolated from neighbors
  process_every_n_frames: 1
  tiling:
    enabled: false
    grid: [2, 2]              # [rows, cols] -- e.g., [1, 4] for 4 horizontal strips
    overlap: 0.1
    equirect_aware_overlap: false
    edge_overlap_boost: 1.5   # overlap multiplier at horizontal frame edges

field_of_interest:
  enabled: true
  # fixed: use center_yaw_deg as-is; auto: compute from first N seconds of detections
  center_mode: fixed
  center_yaw_deg: 0
  yaw_window_deg: 160        # +/-80 from center (tighter to exclude sideline spectators)
  pitch_min_deg: -25         # tighter lower bound to reject near-camera sideline spectators
  pitch_max_deg: 15
  auto_sample_seconds: 30    # seconds to sample for auto center mode
  auto_min_conf: 0.25        # min detection confidence for auto-center sampling

tracker:
  algorithm: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.4
  # Ball selection sanity checks (all values in detector.resolution pixel space)
  # At default resolution [1920, 960], 200px ≈ 10% of frame width
  max_speed_px_per_frame: 200
  max_displacement_px: 300
  min_bbox_area: 10
  max_bbox_area: 10000

camera:
  max_pan_speed_deg_per_sec: 45.0
  max_fast_pan_speed_deg_per_sec: 90.0
  ema_alpha: 0.10
  default_fov: 90.0
  min_fov: 80.0
  max_fov: 100.0
  lost_coast_frames: 30
  lost_drift_frames: 90
  field_center_yaw_deg: 0.0
  field_center_pitch_deg: -5.0
  # Deadband: ignore movements smaller than this to prevent micro-oscillation
  deadband_deg: 2.5
  # Minimum velocity threshold to start camera movement (deg/sec)
  velocity_threshold_deg_per_sec: 4.0
  # Immediately widen FOV when ball is lost
  lost_fov_widen: true
  # FOV smoothing (lower = smoother zoom transitions, 0.08 ≈ 12-frame half-life)
  fov_ema_alpha: 0.08
  # Spatial dead-zone: suppress pan when ball is in center portion of frame
  spatial_deadzone_enabled: true
  spatial_deadzone_frac: 0.30       # center 30% of FOV = no-pan zone
  spatial_deadzone_ramp: 0.20       # additional 20% for gain ramp (0->1)
  # Velocity lookahead: project target ahead on fast passes
  lookahead_enabled: true
  lookahead_frames: 3
  lookahead_max_deg: 10.0
  kalman:
    process_noise: 0.1
    measurement_noise: 2.0

reframer:
  output_resolution: [3840, 2160]
  # Pass source frames at native resolution to e2p (null = no downscale)
  # Set to [3840, 1920] to downscale before reframing for speed
  # Set to [3840, 1920] to downscale before reframing for speed (1080p output only)
  # null = use full source resolution for best output quality (recommended for 8K source)
  source_downscale: null
  num_workers: 12
  interpolation: bilinear
  # Seconds of overlap at segment boundaries for codec warmup (clean cuts)
  overlap_sec: 0.5
  tactical_fov: 120
  tactical_yaw: 0.0
  tactical_pitch: -5.0

highlights:
  speed_percentile: 95
  direction_change_deg: 90
  goal_box_regions:
    - [0.0, 0.3, 0.08, 0.7]
    - [0.92, 0.3, 1.0, 0.7]
  pre_margin_sec: 5.0
  post_margin_sec: 3.0
  min_clip_gap_sec: 5.0
  min_clip_duration_sec: 3.0

  # Cluster-based detectors (require player_cluster.json)
  cluster_convergence_window: 10
  cluster_convergence_deg: 8.0
  cluster_velocity_window: 5
  cluster_velocity_deg_per_sec: 15.0
  cluster_goal_zone_regions: null    # null = reuse goal_box_regions
  cluster_density_percentile: 90
  camera_motion_window: 5
  camera_motion_deg_per_sec: 12.0
  camera_zoom_delta: 4.0
  same_type_cooldown_sec: 0.75
  motion_only_penalty: 0.8

  # Scoring and ranking
  score_weights:
    speed: 1.0
    goal_box: 1.5
    direction_change: 0.8
    cluster_convergence: 1.2
    cluster_velocity: 0.7
    cluster_goal_zone: 1.3
    cluster_density: 0.5
    camera_motion: 0.8
  combined_signal_bonus: 1.5
  min_clip_score: 2.0
  max_clips: 20

exporter:
  codec: libx264
  crf: 16
  preset: slow
  # Encoder: cpu (libx264/libx265) or nvenc (NVIDIA hardware encoder)
  encoder: nvenc
  audio: copy
  archive_raw: false
  delete_raw: false

watcher:
  extensions: [".mp4", ".insv", ".mov"]
  # Ignore files still being uploaded (staging extensions)
  ignore_suffixes: [".uploading", ".tmp", ".part"]
  # File size must be stable for stability_checks * stability_interval_sec
  # Default: 5 * 10s = 50 seconds of stable size before processing
  stability_checks: 5
  stability_interval_sec: 10.0
  # Persisted dedupe state file.
  # Relative paths resolve under: <paths.processed>/.state/
  processed_state_file: watcher_processed_ingest.json
  # Cap persisted dedupe records to bound on-disk growth (0 = unlimited)
  processed_state_max_entries: 50000

ingest:
  archive_on_success: true
  archive_dir: /tank/archive_raw
  # move: relocate original out of ingest (atomic rename or copy+delete)
  # copy: keep original in ingest, place a copy in archive_dir
  # leave: do nothing (disable archival regardless of archive_on_success)
  archive_mode: move
  # Available placeholders: {match} = input stem, {job_id} = pipeline job id, {ext} = .mp4 etc.
  archive_name_template: "{match}_{job_id}{ext}"
  # suffix: append _01, _02, ... if destination exists
  # skip: leave source in ingest and log warning
  # overwrite: replace destination (log warning)
  archive_collision: suffix

active_learning:
  enabled: true
  export_dir: /tank/labeling
  export_max_frames: 600
  # Only export candidate frames whose frame_index % export_every_n_frames == 0
  export_every_n_frames: 2
  # Low-confidence band: detections in [low_conf_min, low_conf_max] are hard frames
  low_conf_min: 0.10
  low_conf_max: 0.50
  # Lost-ball run: export one representative frame when streak reaches this many frames
  lost_run_frames: 5
  # Jump/speed rejection export threshold (only export if distance >= this)
  jump_trigger_px: 150

# --- YOLO Detection Pipeline ---
# COCO-pretrained YOLO for sports ball (class 32) + person (class 0) detection
detection:
  path: "/app/models/yolo26l.pt"
  classes: [32, 0]           # COCO sports ball + person
  conf: 0.10
  iou: 0.5
  img_size: 3840
  max_det: 50
  half: true
  device: "cuda:0"
  # Ball-specific model override (temporal heatmap detection)
  ball_model:
    type: yolo              # "tracknet" to enable TrackNetV3 temporal ball detection
    path: null              # path to TrackNetV3 weights (.pt)
    input_height: 288
    input_width: 512
    buffer_size: 3          # number of frames in temporal window
    heatmap_threshold: 0.5
    peak_radius: 5
    synthetic_bbox_half: 5  # half-size of synthetic bbox for TrackNetV3 detections

# Spatial and temporal filters for detection quality
filters:
  # Vertical band filter: reject detections outside [min_y_frac, max_y_frac]
  # Removes sky, scoreboard, and below-pitch false positives
  min_y_frac: 0.20
  max_y_frac: 0.85
  # Jump/speed sanity (used by BallStabilizer for rejection)
  max_jump_px: 250
  max_speed_px_per_s: 2500
  jump_max_gap_frames: 15   # after this accepted-frame gap, reset jump anchor for reacquisition

# YOLO pipeline ball stabilization: persistence gate + EMA smoothing
tracking:
  ema_alpha: 0.25
  require_persistence: 3     # require N detections in window to accept
  window: 5                  # rolling window size

# --- Center of Play ---
# Hybrid camera tracking: blend ball position with player cluster centroid
center_of_play:
  enabled: true
  player_class: 0             # COCO person class
  min_player_conf: 0.60       # stricter threshold to reduce sideline spectators in the cluster
  trim_fraction: 0.25         # discard more outliers from each end (removes GKs + sideline clutter)
  min_players: 5              # require a fuller player group before trusting the cluster
  ball_blend_weight: 0.15     # when ball detected confidently: 85% ball, 15% cluster
  low_conf_ball_blend_weight: 0.40  # when ball is weak, cluster gets significant influence
  ema_alpha: 0.15             # slower centroid smoothing to reduce jitter
  fov_from_spread: true       # adapt FOV based on player spread
  spread_max_fov: 105.0       # max FOV when players very spread out
  spread_min_deg: 15.0        # spread below this -> min_fov
  spread_max_deg: 60.0        # spread above this -> spread_max_fov
  # Velocity-adaptive blending: fast ball -> more ball weight, slow -> more cluster
  velocity_blend_enabled: true
  fast_ball_weight: 0.95             # ball weight at high velocity
  slow_ball_weight: 0.50             # ball weight at low velocity / stoppage
  velocity_fast_thresh_deg_per_sec: 20.0
  velocity_slow_thresh_deg_per_sec: 2.0

dashboard:
  enabled: true
  db_path: /tank/data/dashboard.db
  port: 8088

mode:
  allow_no_model: true

logging:
  level: INFO
  file: /tank/logs/soccer360.log
