services:
  worker:
    image: soccer360-worker:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soccer360-worker
    restart: unless-stopped
    command: ["watch"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    # Fallback if console script resolution fails:
    # command: ["python", "-m", "src.cli", "watch"]
    # Intentionally avoid mounts that mask baked /app/yolov8s.pt or /app/.ultralytics.
    volumes:
      - /tank:/tank
      - /scratch:/scratch
      - ./configs:/app/configs:ro
      - /tank/models:/app/models
    environment:
      - SOCCER360_CONFIG=/app/configs/pipeline.yaml
      - ULTRALYTICS_HOME=/app/.ultralytics
      - YOLO_CONFIG_DIR=/app/.ultralytics
    user: "1000:1000"
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "bash", "/app/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  labelstudio:
    image: heartexlabs/label-studio:latest
    container_name: soccer360-labelstudio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - labelstudio_data:/label-studio/data
      - /tank/labeling:/label-studio/data/labeling
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - SECRET_KEY=${LABEL_STUDIO_SECRET_KEY:-soccer360-local-change-me}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    image: soccer360-worker:local
    pull_policy: never
    container_name: soccer360-dashboard
    restart: unless-stopped
    entrypoint: ["python", "-m", "src.cli"]
    command: ["dashboard", "--port", "8088"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    ports:
      - "8088:8088"
    volumes:
      - /tank:/tank
      - /scratch:/scratch
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
    working_dir: /app
    environment:
      - SOCCER360_CONFIG=/app/configs/pipeline.yaml
      - PYTHONDONTWRITEBYTECODE=1
    user: "1000:1000"
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/api/status')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  parent-site:
    image: nginx:alpine
    container_name: soccer360-parent-site
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      - ./parent-site:/usr/share/nginx/html:ro

volumes:
  labelstudio_data:
